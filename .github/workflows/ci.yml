name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - services/llm-gateway
          - services/rag
          - services/channel-gateway
          - services/crm-connector
          - mocks/mock-llm
          - mocks/mock-rag
          - mocks/mock-crm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Vet
        working-directory: ${{ matrix.service }}
        run: go vet ./...
      - name: Build
        working-directory: ${{ matrix.service }}
        run: go build ./...
      - name: Test
        working-directory: ${{ matrix.service }}
        run: go test ./...

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose
        run: |
          cp .env.example .env
          docker compose config >/dev/null
