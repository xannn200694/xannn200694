name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - services/llm-gateway
          - services/rag
          - services/channel-gateway
          - services/crm-connector
          - mocks/mock-llm
          - mocks/mock-rag
          - mocks/mock-crm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint (ruff)
        working-directory: ${{ matrix.service }}
        run: pip install ruff && ruff check . || true
      - name: Tests
        working-directory: ${{ matrix.service }}
        run: python -m pytest -q

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose
        run: |
          cp .env.example .env
          docker compose config >/dev/null
